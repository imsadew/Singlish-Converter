        // Example text setter
        function setExample(example) {
            const input = document.getElementById('input-text');
            input.value = example;
            convertText();
            input.focus();
        }

        // Copy functionality
        document.getElementById('copy-btn').addEventListener('click', function() {
            const output = document.getElementById('output-text');
            const text = output.textContent;
            
            if (text === 'Result will appear here...') return;
            
            navigator.clipboard.writeText(text).then(() => {
                const originalInnerHTML = this.innerHTML;
                
                // Change button text and style
                this.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Copied!
                `;
                this.classList.add('bg-green-500', 'text-white');
                this.classList.remove('bg-neutral-200', 'dark:bg-neutral-700', 'text-neutral-700', 'dark:text-neutral-200');
                
                // Restore button after 2 seconds
                setTimeout(() => {
                    this.innerHTML = originalInnerHTML;
                    this.classList.remove('bg-green-500', 'text-white');
                    this.classList.add('bg-neutral-200', 'dark:bg-neutral-700', 'text-neutral-700', 'dark:text-neutral-200');
                }, 2000);
            });
        });

        // Clear functionality
        document.getElementById('clear-btn').addEventListener('click', function() {
            document.getElementById('input-text').value = '';
            document.getElementById('output-text').textContent = 'Result will appear here...';
            document.getElementById('character-count').textContent = '0 characters';
            document.getElementById('input-text').focus();
        });

        // Theme Toggle Functionality
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        // Check for saved theme preference or use system preference
        if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            html.classList.remove('dark');
        } else {
            html.classList.add('dark');
        }

        // Theme toggle button functionality
        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            
            if (html.classList.contains('dark')) {
                localStorage.theme = 'dark';
            } else {
                localStorage.theme = 'light';
            }
        });

        // Initialize service worker for PWA support
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('sw.js')
                .then(function () { console.log("Service Worker Registered"); });
        }

        // --- මේ code එක index.html එකේ අන්තිම <script> tag එක ඇතුළට දාන්න ---

// Share Button Functionality
const shareBtn = document.getElementById('share-btn');
if (shareBtn) {
    shareBtn.addEventListener('click', async () => {
        const outputElement = document.getElementById('output-text');
        const textToShare = outputElement.textContent;

        if (!textToShare || textToShare === 'Result will appear here...') {
            alert('Please convert some text first to share.');
            return;
        }

        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Converted Sinhala Text',
                    text: textToShare,
                });
                console.log('Text shared successfully');
            } catch (err) {
                console.error('Error sharing text:', err);
            }
        } else {
            // Fallback if Web Share API is not supported
            // You could try copying to clipboard again as a fallback
            try {
                await navigator.clipboard.writeText(textToShare);
                alert('Web Share not supported. Text copied to clipboard instead.');
            } catch (copyErr) {
                 alert('Web Share not supported and could not copy text.');
                 console.error('Fallback copy error:', copyErr);
            }
        }
    });
} else {
    console.warn("Share button element (#share-btn) not found.");
}


// Export Button Functionality (Download as .txt file)
const exportBtn = document.getElementById('export-btn');
if (exportBtn) {
    exportBtn.addEventListener('click', () => {
        const outputElement = document.getElementById('output-text');
        const textToExport = outputElement.textContent;

        if (!textToExport || textToExport === 'Result will appear here...') {
            alert('Please convert some text first to export.');
            return;
        }

        // Create a Blob (file content)
        const blob = new Blob([textToExport], { type: 'text/plain;charset=utf-8' });

        // Create a temporary URL for the Blob
        const url = URL.createObjectURL(blob);

        // Create a temporary link element
        const tempLink = document.createElement('a');
        tempLink.href = url;
        tempLink.setAttribute('download', 'sinhala_text.txt'); // Set filename

        // Simulate a click on the link to trigger download
        tempLink.style.display = 'none'; // Hide the link
        document.body.appendChild(tempLink);
        tempLink.click();

        // Clean up: remove the link and revoke the URL
        document.body.removeChild(tempLink);
        URL.revokeObjectURL(url);
    });
} else {
     console.warn("Export button element (#export-btn) not found.");
}


// Import Button Functionality (Upload .txt file)
const importBtn = document.getElementById('import-btn');
const fileInput = document.createElement('input'); // Create hidden file input
fileInput.type = 'file';
fileInput.accept = '.txt'; // Accept only .txt files
fileInput.style.display = 'none'; // Keep it hidden

// When the import button is clicked, trigger the hidden file input
if (importBtn) {
    importBtn.addEventListener('click', () => {
        fileInput.click(); // Click the hidden input
    });
} else {
     console.warn("Import button element (#import-btn) not found.");
}


// When a file is selected in the hidden input
fileInput.addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) {
        return; // No file selected
    }

    const reader = new FileReader();

    reader.onload = (e) => {
        const fileContent = e.target.result;
        const inputElement = document.getElementById('input-text');
        if(inputElement) {
            inputElement.value = fileContent; // Put file content in input area
            // Optionally, trigger conversion immediately
            if (typeof convertText === 'function') {
                 convertText();
            }
        } else {
             console.error("Input text element (#input-text) not found for import.");
        }
    };

    reader.onerror = (e) => {
        console.error('Error reading file:', e);
        alert('Could not read the selected file.');
    };

    reader.readAsText(file); // Read the file as text

    // Reset the file input value so the 'change' event fires even if the same file is selected again
    event.target.value = null;
});

// Append the hidden file input to the body (needed for it to work)
document.body.appendChild(fileInput);
